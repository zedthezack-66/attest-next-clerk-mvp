services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: attest
      POSTGRES_PASSWORD: attest
      POSTGRES_DB: attest
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: attest
      MINIO_ROOT_PASSWORD: attestsecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    env_file: ../.env.example
    depends_on:
      - postgres
      - minio
    ports:
      - "8000:8000"

  ocr-worker:
    build:
      context: ..
      dockerfile: workers/ocr_worker/Dockerfile
    env_file: ../.env.example
    depends_on:
      - api
      - postgres
      - minio

  extraction-worker:
    build:
      context: ..
      dockerfile: workers/extraction_worker/Dockerfile
    env_file: ../.env.example
    depends_on:
      - ocr-worker
      - postgres

  portal:
    build:
      context: ..
      dockerfile: apps/portal/Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      - api
    ports:
      - "3000:3000"

  dashboard:
    build:
      context: ..
      dockerfile: apps/dashboard/Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      - api
    ports:
      - "3001:3000"

volumes:
  postgres_data:
  minio_data:

